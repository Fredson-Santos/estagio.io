name: estagio

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: estagio
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estagio"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - estagio_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "python scripts/wait_for_db.py && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/estagio
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-changeme}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - estagio_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: node ./dist/server/entry.mjs
    environment:
      - BACKEND_URL=http://backend:8000
      - HOST=0.0.0.0
      - PORT=4321
      - ADMIN_API_KEY=${ADMIN_API_KEY:-changeme}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme_admin_password}
      - ADMIN_SECRET=${ADMIN_SECRET:-generate_a_long_random_secret_here_minimum_32_chars}
    expose:
      - "4321"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - estagio_net

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/estagio
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-llama-3.1-8b-instant}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ETL_INTERVAL_HOURS=${ETL_INTERVAL_HOURS:-6}
      - RULES_FILE=/app/data/scraper_rules.json
    volumes:
      - scraper_rules:/app/data
    restart: always
    networks:
      - estagio_net

volumes:
  postgres_data:
  scraper_rules:

networks:
  estagio_net:
    driver: bridge