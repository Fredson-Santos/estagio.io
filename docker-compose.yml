version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estagio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "python scripts/wait_for_db.py && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/estagio
      - CORS_ORIGINS=["http://localhost:4321","http://127.0.0.1:4321","http://localhost:3000","http://127.0.0.1:3000"]
    volumes:
      - ./backend:/app
    restart: always

  job-extractor:
    build:
      context: ./job-extractor
      dockerfile: Dockerfile
    ports:
      - "8002:8001"
    env_file:
      - ./job-extractor/.env
    volumes:
      - ./job-extractor:/app
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "4321:4321"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: always

volumes:
  postgres_data:
