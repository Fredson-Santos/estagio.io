name: estagio

services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-estagio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-estagio}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - estagio_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-estagio}
      - SCRAPER_URL=http://scraper:9090
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - estagio_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: node ./dist/server/entry.mjs
    environment:
      - BACKEND_URL=http://backend:8000
      - HOST=0.0.0.0
      - PORT=4321
      - ADMIN_API_KEY=${ADMIN_API_KEY:-changeme}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme_admin_password}
      - ADMIN_SECRET=${ADMIN_SECRET:-generate_a_long_random_secret_here_minimum_32_chars}
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - estagio_net
      - dokploy-network

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - SCRAPER_DB_PATH=/app/db/scraper.db
      - BACKEND_URL=http://backend:8000
      - BACKEND_API_KEY=${ADMIN_API_KEY:-changeme}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-llama-3.1-8b-instant}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AREA_MATCHER_MODE=${AREA_MATCHER_MODE:-regex}
      - ETL_INTERVAL_HOURS=${ETL_INTERVAL_HOURS:-6}
      - RULES_FILE=/app/data/scraper_rules.json
    volumes:
      - scraper_data:/app/db
      - scraper_rules:/app/data
    restart: always
    networks:
      - estagio_net

volumes:
  pgdata:
  scraper_data:
  scraper_rules:

networks:
  estagio_net:
    driver: bridge
  dokploy-network:
    external: true